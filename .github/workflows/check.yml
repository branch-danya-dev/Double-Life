name: Luau and Rojo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned build tools
        run: |
          mkdir -p /tmp/double-life-tools
          cd /tmp/double-life-tools
          curl -fL --retry 3 -o luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          curl -fL --retry 3 -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip
          echo '186e5ddaa2b048ebc7390c11ed1b00c04e7d3beaffed429250329e3575d2ece2  luau.zip' | sha256sum -c -
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  rojo.zip' | sha256sum -c -
          unzip -q luau.zip
          unzip -q rojo.zip
          chmod +x luau luau-compile luau-analyze rojo
          echo /tmp/double-life-tools >> "$GITHUB_PATH"
      - name: Policies, syntax and type analysis
        run: |
          luau tests/run.luau
          luau tests/rounds.luau
          luau tests/events.luau
          luau tests/progression.luau
          luau tests/persistence.luau
          luau tests/reconnect.luau
          luau tests/social.luau
          luau tests/commerce.luau
          luau tests/mansion.luau
          luau tests/presentation.luau
          luau tests/balance.luau
          python3 tests/run-staff-delivery.py
          luau tests/matchmaking.luau
          luau tests/prologue.luau
          luau tests/retention.luau
          python3 tests/run-telemetry.py
          python3 tests/run-matchmaking.py
          luau tests/mimic-avatars.luau
          python3 tests/run-mimic-animation.py
          python3 tests/run-mimic-rig.py
          python3 tests/run-mimic-presentation.py
          python3 tests/run-mimic-polish.py
          python3 tests/check-mimic-polish.py
          luau tests/visual-gate.luau
          luau tests/match-duration.luau
          python3 tests/run-match-duration.py
          luau-analyze src/shared/RoundTime.luau tests/m120/Timeline.luau tests/match-duration.luau tests/match-duration-runtime.luau
          find src tests -name '*.luau' -print0 | xargs -0 luau-compile --null
          luau-analyze src/server/GuardPolicy.luau src/server/RequestLedger.luau src/server/RoundPolicy.luau src/server/RolePlan.luau src/server/SessionClock.luau src/server/EventPolicy.luau src/server/PracticePolicy.luau tests/run.luau tests/rounds.luau tests/events.luau
          luau-analyze src/server/ProgressionCatalog.luau src/server/ProfileSchema.luau src/server/ProgressionPolicy.luau src/server/ProfileStore.luau tests/MemoryStore.luau tests/progression.luau tests/persistence.luau
          luau-analyze src/server/ProfileSessions.luau tests/reconnect.luau
          luau-analyze src/server/SocialPolicy.luau src/server/CommerceStore.luau src/server/CommercePolicy.luau src/server/CommerceCatalog.luau src/server/MonetizationSettings.luau src/server/AnalyticsPolicy.luau tests/FakeMarketplace.luau tests/social.luau tests/commerce.luau
          luau-analyze src/server/MansionLayout.luau src/server/WorldContract.luau tests/mansion.luau
          luau-analyze src/server/MansionArtPlan.luau src/shared/Presentation.luau tests/presentation.luau
          luau-analyze src/shared/RoleGuide.luau tests/PlaytestMetrics.luau tests/balance.luau
          luau-analyze tests/staff-delivery.luau
          luau-analyze src/server/ActorPolicy.luau src/server/QueuePolicy.luau src/server/MatchPool.luau src/server/MatchSettings.luau tests/matchmaking.luau
          luau-analyze src/server/PrologueContent.luau src/server/ProloguePolicy.luau tests/prologue.luau
          luau-analyze src/server/RetentionPolicy.luau src/server/TuningConfig.luau tests/TelemetrySink.luau tests/retention.luau
          luau-analyze src/server/MimicAppearance.luau src/server/MimicLoadPolicy.luau tests/mimic-avatars.luau
          luau-analyze src/server/MimicCrowdPolicy.luau
          luau-analyze src/shared/LobbyPresentation.luau tests/m1121/Approach.luau tests/visual-gate.luau
          python3 tests/check-runtime-globals.py
      - name: Build and inspect artifacts
        run: |
          rojo build default.project.json -o DoubleLife-M8.rbxlx
          rojo build atmosphere-tests.project.json -o DoubleLife-M8-tests.rbxlx
          rojo build atmosphere-review.project.json -o DoubleLife-M8-review.rbxlx
          rojo build atmosphere-load.project.json -o DoubleLife-M8-load.rbxlx
          rojo build playtests.project.json -o DoubleLife-M8-playtests.rbxlx
          rojo build playtests-staff.project.json -o DoubleLife-M8-staff.rbxlx
          rojo build matchmaking-tests.project.json -o DoubleLife-M9-tests.rbxlx
          rojo build prologue-tests.project.json -o DoubleLife-M10-tests.rbxlx
          rojo build retention-tests.project.json -o DoubleLife-M11-tests.rbxlx
          rojo build mimic-avatar-review.project.json -o DoubleLife-M111-review.rbxlx
          rojo build mimic-avatar-tests.project.json -o DoubleLife-M111-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M8.rbxlx DoubleLife-M8-playtests.rbxlx DoubleLife-M8-staff.rbxlx
          python3 tests/check-build.py DoubleLife-M8.rbxlx
          python3 tests/check-fixtures.py DoubleLife-M8-tests.rbxlx DoubleLife-M8-review.rbxlx DoubleLife-M8-load.rbxlx DoubleLife-M8-playtests.rbxlx DoubleLife-M8-staff.rbxlx DoubleLife-M9-tests.rbxlx DoubleLife-M10-tests.rbxlx DoubleLife-M11-tests.rbxlx
          python3 tests/check-assets.py
          python3 tests/check-mimic-assets.py
          python3 tests/check-fixtures.py DoubleLife-M111-review.rbxlx DoubleLife-M111-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M111-review.rbxlx DoubleLife-M111-tests.rbxlx
          rojo build mimic-polish-tests.project.json -o DoubleLife-M112-tests.rbxlx
          python3 tests/check-fixtures.py DoubleLife-M112-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M112-tests.rbxlx
          rojo build mimic-visual-gate-tests.project.json -o DoubleLife-M1121-tests.rbxlx
          python3 tests/check-fixtures.py DoubleLife-M1121-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M1121-tests.rbxlx
          rojo build mimic-motion-tests.project.json -o DoubleLife-M1121-motion-tests.rbxlx
          python3 tests/check-fixtures.py DoubleLife-M1121-motion-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M1121-motion-tests.rbxlx
          rojo build match-duration-tests.project.json -o DoubleLife-M120-tests.rbxlx
          python3 tests/check-fixtures.py DoubleLife-M120-tests.rbxlx
          python3 tests/check-chat.py DoubleLife-M120-tests.rbxlx
      - uses: actions/upload-artifact@v4
        with:
          name: DoubleLife-M12-0
          path: '*.rbxlx'
